- name: Prepare hosts
  hosts: "{{ target | default('all') }}"
  become: true
  roles:
    - role: prepare

- name: Install k3s
  hosts: "{{ target | default('all') }}"
  become: true
  roles:
    - role: k3s

- name: Configure kubeconfig
  hosts: localhost
  become: false
  run_once: true
  roles:
    - kubeconfig

- name: Apply cluster add-ons
  hosts: localhost
  become: false
  run_once: true
  roles:
    - role: gateway_api
    - role: cilium
    - role: cert_manager
