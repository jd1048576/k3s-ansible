- name: Helm info cilium
  kubernetes.core.helm_info:
    release_name: cilium
    release_namespace: kube-system
  register: cilium_helm_info

- name: Helm install cilium-preflight
  when: cilium_helm_info.status is defined and not(cilium_helm_info.status.chart is match("cilium-" + cilium_version))
  block:
    - name: Helm install cilium pre-flight
      kubernetes.core.helm:
        chart_ref: oci://quay.io/cilium/charts/cilium
        chart_version: "{{ cilium_version }}"
        release_name: cilium-preflight
        release_namespace: kube-system
        release_values: "{{ cilium_preflight_values }}"

    - name: Check cilium pre-flight DaemonSet
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: cilium-pre-flight-check
        namespace: kube-system
        wait: true
        wait_timeout: 600

    - name: Check cilium pre-flight Deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: cilium-pre-flight-check
        namespace: kube-system
        wait: true

    - name: Helm uninstall cilium pre-flight
      kubernetes.core.helm:
        release_name: cilium-preflight
        release_namespace: kube-system
        release_state: absent

- name: Helm install cilium
  kubernetes.core.helm:
    chart_ref: oci://quay.io/cilium/charts/cilium
    chart_version: "{{ cilium_version }}"
    release_name: cilium
    release_namespace: kube-system
    release_values: "{{ cilium_values }}"

- name: Check cilium operator
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cilium-operator
    namespace: kube-system
    wait: true

- name: Check cilium agent
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: cilium
    namespace: kube-system
    wait: true
    wait_timeout: 600

- name: Check cilium envoy
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: cilium-envoy
    namespace: kube-system
    wait: true
    wait_timeout: 300

- name: Create internal cilium cidr group
  kubernetes.core.k8s:
    state: present
    resource_definition:
      apiVersion: cilium.io/v2
      kind: CiliumCIDRGroup
      metadata:
        name: internal
      spec:
        externalCIDRs:
          - "{{ (hostvars[groups['all'][0]].ansible_facts['default_ipv4']['address'] + '/' + hostvars[groups['all'][0]].ansible_facts['default_ipv4']['netmask']) | ansible.utils.ipaddr('network/prefix') }}"

- name: Fetch Cloudflare IPv4 list
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v4
    return_content: true
  register: cilium_cloudflare_ips

- name: Create cloudflare cilium cidr group
  kubernetes.core.k8s:
    state: present
    resource_definition:
      apiVersion: cilium.io/v2
      kind: CiliumCIDRGroup
      metadata:
        name: cloudflare
      spec:
        externalCIDRs: "{{ cilium_cloudflare_ips.content | ansible.builtin.split | ansible.builtin.sort }}"

- name: Create host cilium network policy
  kubernetes.core.k8s:
    state: present
    resource_definition:
      apiVersion: cilium.io/v2
      kind: CiliumClusterwideNetworkPolicy
      metadata:
        name: host
      spec:
        nodeSelector: {}
        ingress:
          - fromEntities:
              - cluster
          - fromCIDRSet:
              - cidrGroupRef: internal
          - icmps:
              - fields:
                  - type: EchoRequest
                    family: IPv4
        egress:
          - toEntities:
              - all

- name: Create cilium load balancer ip pool
  kubernetes.core.k8s:
    state: present
    resource_definition:
      apiVersion: cilium.io/v2
      kind: CiliumLoadBalancerIPPool
      metadata:
        name: default
      spec:
        blocks:
          - start: "{{ hostvars[groups['all'][0]].ansible_facts['default_ipv4']['address'] }}"

- name: Create cilium l2 announcement policy
  kubernetes.core.k8s:
    state: present
    resource_definition:
      apiVersion: cilium.io/v2alpha1
      kind: CiliumL2AnnouncementPolicy
      metadata:
        name: default
      spec:
        interfaces:
          - ^eth[0-9]+
        loadBalancerIPs: true
